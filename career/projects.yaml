  - id: github-activity-lakehouse
    name: "GitHub Activity Lakehouse"
    type: "Personal Project"
    status: "Completed"
    featured: true

    description:
      en: >
        Data engineering lakehouse that ingests public GH Archive events
        and transforms them into analytics-ready datasets through Bronze,
        Silver and Gold layers.

      pt: >
        Lakehouse de engenharia de dados que ingere eventos públicos do
        GH Archive e os transforma em datasets prontos para análise através
        das camadas Bronze, Silver e Gold.

    technologies:
      - Python
      - PySpark
      - Apache Spark
      - Delta Lake
      - Databricks
      - Unity Catalog
      - Pandas
      - Plotly
      - Docker
      - Docker Compose
      - GitHub Actions
      - pytest
      - Ruff
      - JupyterLab

    concepts:
      - ETL
      - Data Engineering
      - Data Pipelines
      - Lakehouse Architecture
      - Medallion Architecture
      - Data Quality
      - Data Lineage
      - Data Validation
      - Automated Testing
      - CI/CD

    highlights:
      en:
        - >
          Implemented Bronze, Silver and Gold data layers for processing
          public GitHub Archive event data.

        - >
          Built controlled hourly ingestion with validation of compressed
          GH Archive files and replayable raw event storage.

        - >
          Implemented explicit schemas, deterministic deduplication,
          rejected-record lineage and data quality checks.

        - >
          Created Gold-layer analytics datasets and an interactive Plotly
          dashboard published with GitHub Pages.

        - >
          Added automated testing, linting and CI workflows using pytest,
          Ruff and GitHub Actions.

        - >
          Configured a Databricks Free Edition execution profile that reuses
          the same production modules and writes demonstration data using
          Unity Catalog.

      pt:
        - >
          Implementei camadas de dados Bronze, Silver e Gold para processar
          dados públicos de eventos do GitHub Archive.

        - >
          Criei uma ingestão horária controlada com validação de arquivos
          compactados do GH Archive e armazenamento de eventos brutos que
          permite reprocessamento.

        - >
          Implementei schemas explícitos, desduplicação determinística,
          linhagem de registros rejeitados e verificações de qualidade de
          dados.

        - >
          Criei datasets analíticos na camada Gold e um dashboard interativo
          com Plotly publicado no GitHub Pages.

        - >
          Adicionei testes automatizados, linting e fluxos de CI usando pytest,
          Ruff e GitHub Actions.

        - >
          Configurei um perfil de execução no Databricks Free Edition que
          reutiliza os mesmos módulos de produção e grava dados de demonstração
          usando Unity Catalog.

    links:
      github: "https://github.com/FelipeEnne/github-activity-lakehouse"
      demo: "https://felipeenne.github.io/github-activity-lakehouse/"

    skill_evidence:
      professional: false
      project_based: true

    sources:
      - github


  - id: audiobook-production-automation
    name: "Audiobook Production Automation Platform"
    type: "Personal Project"
    status: "In Development"
    featured: true

    description:
      en: >
        Automation platform for producing and publishing audiobooks at
        scale on YouTube using Python, FastAPI, local text-to-speech and
        YouTube integrations.

      pt: >
        Plataforma de automação para produção e publicação de audiolivros
        em escala no YouTube usando Python, FastAPI, síntese de voz local
        e integrações com o YouTube.

    technologies:
      - Python
      - FastAPI
      - REST APIs
      - Local TTS
      - YouTube API

    concepts:
      - Process Automation
      - API Integration
      - Text-to-Speech
      - Content Automation
      - File Processing
      - Workflow Automation

    highlights:
      en:
        - >
          Designed a workflow for automating audiobook production from
          source text through generated audio files.

        - >
          Used local text-to-speech models to reduce dependency on
          third-party voice generation services.

        - >
          Designed automation for file organization, thumbnails,
          descriptions, playlists and scheduled YouTube publishing.

        - >
          Built API-based components using Python and FastAPI to orchestrate
          parts of the content production pipeline.

      pt:
        - >
          Projetei um fluxo de trabalho para automatizar a produção de
          audiolivros desde o texto-fonte até os arquivos de áudio gerados.

        - >
          Usei modelos locais de conversão de texto em fala para reduzir a
          dependência de serviços de terceiros para geração de voz.

        - >
          Projetei automações para organização de arquivos, thumbnails,
          descrições, playlists e publicação agendada no YouTube.

        - >
          Desenvolvi componentes baseados em APIs usando Python e FastAPI para
          orquestrar partes do pipeline de produção de conteúdo.

    links:
      github: null
      demo: https://www.youtube.com/@dominiopublico-audiolivros

    skill_evidence:
      professional: false
      project_based: true

    sources:
      - cv

    source_notes:
      note: >
        Project is documented in the current CV. Public repository and
        production URL have not yet been added to the canonical data.


  - id: climbing-the-volcano
    name: "Climbing the Volcano"
    type: "Microverse Capstone Project"
    status: "Completed"
    featured: true

    description:
      en: >
        Browser-based 2D game where the player collects coins while
        escaping a volcano, developed as a JavaScript capstone project
        using Phaser.

      pt: >
        Jogo 2D para navegador no qual o jogador coleta moedas enquanto
        escapa de um vulcão, desenvolvido como projeto final em JavaScript
        utilizando Phaser.

    technologies:
      - JavaScript
      - Phaser
      - HTML
      - CSS
      - Jest
      - Webpack
      - ESLint
      - REST APIs

    concepts:
      - Game Development
      - Collision Logic
      - Character Movement
      - Item Collection
      - API Integration
      - Automated Testing

    highlights:
      en:
        - >
          Developed game mechanics including character movement,
          collision handling and coin collection.

        - >
          Implemented multiple game scenes including menu, gameplay,
          game-over and leaderboard screens.

        - >
          Integrated an API-based leaderboard allowing players to submit
          scores and view the top rankings.

        - >
          Added automated tests with Jest and bundled the application
          using Webpack.

      pt:
        - >
          Desenvolvi mecânicas de jogo, incluindo movimentação do personagem,
          tratamento de colisões e coleta de moedas.

        - >
          Implementei diversas cenas do jogo, incluindo menu, gameplay, game
          over e telas de classificação.

        - >
          Integrei uma classificação baseada em API, permitindo que os
          jogadores enviem pontuações e visualizem as melhores colocações.

        - >
          Adicionei testes automatizados com Jest e empacotei a aplicação
          usando Webpack.

    links:
