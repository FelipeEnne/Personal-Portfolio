name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: portfolio/requirements.txt

      - name: Install portfolio dependencies
        run: python3 -m pip install -r portfolio/requirements.txt

      - name: Build English portfolio context
        run: python3 portfolio/scripts/build_context.py --lang en

      - name: Build Portuguese portfolio context
        run: python3 portfolio/scripts/build_context.py --lang pt

      - name: Render static portfolio
        run: python3 portfolio/scripts/render_site.py

      - name: Validate static site
        run: |
          test -f _site/index.html
          test -f _site/pt/index.html
          test -f _site/assets/css/styles.css
          test -f _site/assets/image/github-activity-lakehouse.png
          test -f _site/assets/doc/CV.pdf
          test -f "_site/assets/doc/Currículo.pdf"
          test -f _site/favicon.ico
          test ! -e _site/career
          test ! -e _site/generated
          test ! -e _site/docs
          grep -q '<html lang="en">' _site/index.html
          grep -q '<html lang="pt-BR">' _site/pt/index.html
          grep -q 'GitHub Activity Lakehouse' _site/index.html
          grep -q 'GitHub Activity Lakehouse' _site/pt/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
